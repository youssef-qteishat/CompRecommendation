[project]
name = "comprecommendation"
version = "0.1.0"
description = ""
authors = [
    {name = "Youssef Qteishat",email = "youssef.qt1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pandera (>=0.34.1,<0.35.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "comps", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
jupyter = "^1.1.1"
matplotlib = "^3.11.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"